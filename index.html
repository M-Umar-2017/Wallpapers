<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11111b">
  <meta name="description" content="A collection of wallpapers for your desktop, in a minimal Catppuccin-themed gallery.">
  <title>Wallpapers — Catppuccin Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      --base: #11111b;
      --mantle: #181825;
      --surface: #1e1e2e;
      --overlay: #313244;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --muted: #6c7086;
      --blue: #89b4fa;
      --lavender: #b4befe;
      --border: #313244;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--base);
      color: var(--text);
      font: 14px/1.6 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    a { color: inherit; }

    .shell {
      width: min(1440px, calc(100% - 48px));
      margin-inline: auto;
    }

    header {
      padding: 56px 0 32px;
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 650;
      letter-spacing: -.07em;
      line-height: 1.05;
    }

    .intro {
      max-width: 620px;
      margin: 16px 0 0;
      color: var(--subtext);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
    }

    .toolbar input {
      width: min(100%, 420px);
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      background: var(--mantle);
      color: var(--text);
      font: inherit;
    }

    .toolbar input::placeholder { color: var(--muted); }
    .toolbar input:focus { border-color: var(--blue); }

    .count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    main { padding: 10px 0 64px; }

    .collection { padding-top: 30px; }

    .collection h2 {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 550;
      letter-spacing: -.03em;
      text-transform: lowercase;
    }

    .collection h2 span {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
      gap: 16px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      transition: border-color .16s ease, transform .16s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--overlay);
    }

    .preview {
      display: grid;
      width: 100%;
      aspect-ratio: 16 / 10;
      place-items: center;
      overflow: hidden;
      background: var(--mantle);
    }

    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-info { padding: 12px; }

    .filename {
      overflow: hidden;
      margin: 0 0 10px;
      color: var(--subtext);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .download {
      display: flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--mantle);
      color: var(--blue);
      font-size: 11px;
      letter-spacing: .08em;
      text-decoration: none;
      transition: background .16s ease, border-color .16s ease;
    }

    .download:hover, .download:focus-visible {
      border-color: var(--blue);
      background: var(--overlay);
    }

    .download svg { width: 14px; height: 14px; }

    .empty {
      padding: 48px 0;
      color: var(--muted);
      text-align: center;
    }

    footer {
      padding: 22px 0 30px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    footer p { margin: 0; }

    @media (max-width: 600px) {
      .shell { width: min(100% - 28px, 1440px); }
      header { padding-top: 36px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .toolbar input { width: 100%; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 10px; }
      .card-info { padding: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell">
      <p class="eyebrow">system24 / wallpaper archive</p>
      <h1>Wallpapers<span style="color:var(--blue)">.</span></h1>
      <p class="intro">A bunch of wallpapers for your desktop. Browse the collections and download any wallpaper you like!</p>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search wallpapers..." aria-label="Search wallpapers">
        <span class="count" id="count" aria-live="polite"></span>
      </div>
    </div>
  </header>
  <main class="shell" id="gallery"></main>
  <footer>
    <div class="shell">
      <p>All rights to every wallpaper belong to its original creator or owner! No ownership is claimed here.</p>
    </div>
  </footer>

    const gallery = document.querySelector("#gallery");
    const search = document.querySelector("#search");
    const count = document.querySelector("#count");
    const downloadIcon = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5v7m0 0 2.75-2.75M8 9.5 5.25 6.75M3 11.5v2h10v-2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function assetUrl(path) {
      return path.split("/").map(encodeURIComponent).join("/");
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const matches = wallpapers.filter(wallpaper =>
        `${wallpaper.name} ${wallpaper.collection}`.toLowerCase().includes(query)
      );
      count.textContent = `${matches.length} / ${wallpapers.length} wallpapers`;
      gallery.replaceChildren();

      const collections = new Map();
      for (const wallpaper of matches) {
        if (!collections.has(wallpaper.collection)) collections.set(wallpaper.collection, []);
        collections.get(wallpaper.collection).push(wallpaper);
      }

      for (const [name, items] of collections) {
        const section = document.createElement("section");
        section.className = "collection";
        const heading = document.createElement("h2");
        heading.textContent = name.replaceAll("-", " ");
        const total = document.createElement("span");
        total.textContent = String(items.length).padStart(2, "0");
        heading.append(total);
        const grid = document.createElement("div");
        grid.className = "grid";

        for (const wallpaper of items) {
          const url = assetUrl(wallpaper.path);
          const card = document.createElement("article");
          card.className = "card";
          const preview = document.createElement("a");
          preview.className = "preview";
          preview.href = url;
          preview.target = "_blank";
          preview.rel = "noopener";
          const image = document.createElement("img");
          image.src = url;
          image.alt = wallpaper.name;
          image.loading = "lazy";
          image.decoding = "async";
          preview.append(image);

          const info = document.createElement("div");
          info.className = "card-info";
          const filename = document.createElement("p");
          filename.className = "filename";
          filename.textContent = wallpaper.name;
          filename.title = wallpaper.name;
          const download = document.createElement("a");
          download.className = "download";
          download.href = url;
          download.download = wallpaper.name;
          download.innerHTML = `${downloadIcon}<span>DOWNLOAD</span>`;
          info.append(filename, download);
          card.append(preview, info);
          grid.append(card);
        }

        section.append(heading, grid);
        gallery.append(section);
      }

      if (matches.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No wallpapers found.";
        gallery.append(empty);
      }
    }

    search.addEventListener("input", render);
    render();
  </script>
